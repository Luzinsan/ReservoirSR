# ==========================================================================
# RRDBNet+ — усиленный ESRGAN-генератор для физических полей.
# ==========================================================================

defaults:
  - optimizer: adamw
  - scheduler: cosine_warmup
  - loss: charbonnier


_target_: reservoir_sr.ml.models.rrdbnet.RRDBNet

in_channels: 3
out_channels: 3
scale: 4
unshuffle_factor: 2
ema_decay: 0.999

n_blocks: 23
n_features: 64
growth_channels: 32
res_scale: 0.2