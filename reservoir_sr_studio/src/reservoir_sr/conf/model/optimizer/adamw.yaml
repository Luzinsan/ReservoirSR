# ==========================================================================
# AdamW — Adam с decoupled weight decay.
# Стандартный выбор для обучения нейросетей (CNN и трансформеры).
# Weight decay применяется напрямую к весам, а не через градиент.
# ==========================================================================

# Класс PyTorch. hydra.utils.instantiate() создаст объект,
# передав остальные ключи как kwargs + params=model.parameters().
_target_: torch.optim.AdamW

# Learning rate — главный гиперпараметр обучения.
# 1e-3 — хороший дефолт для AdamW с cosine scheduler.
lr: 0.001

# Weight decay — L2-регуляризация (предотвращает переобучение).
weight_decay: 0.0001

# Коэффициенты экспоненциального скользящего среднего моментов.
# β1=0.9 для momentum, β2=0.999 для adaptive lr.
betas:
  - 0.9
  - 0.999
