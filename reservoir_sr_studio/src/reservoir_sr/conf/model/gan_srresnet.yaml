# ==========================================================================
# GAN config: MSRResNet generator + Residual PatchGAN discriminator.
# Физический perceptual: Sobel + spectral L1
# ==========================================================================

generator:
  _target_: reservoir_sr.ml.models.srresnet.MSRResNet
  in_channels: 3
  out_channels: 3
  scale: 4
  n_blocks: 8
  n_features: 64
  res_scale: 0.1

discriminator:
  _target_: reservoir_sr.ml.models.discriminators.ResidualFieldDiscriminator
  in_channels: 3
  base_channels: 64
  n_layers: 3

pixel_loss:
  _target_: torch.nn.L1Loss

perceptual_loss:
  _target_: reservoir_sr.ml.training.gan_module.PhysicsPerceptualLoss
  grad_weight: 1.0
  spectral_weight: 0.5

adv_loss:
  _target_: torch.nn.BCEWithLogitsLoss

# ── Loss weights ─────────────────────────────────────
pixel_weight: 10.0
perc_weight: 1.0
adv_weight: 0.01

# ── Training schedule ────────────────────────────────
d_warmup_epochs: 10         # D учится один на фрозен-G
warmup_epochs: 20           # G учится без adv (pixel + perc)
d_steps: 1
g_steps: 1

# ── D stabilization ──────────────────────────────────
d_input_noise_std: 0.02
d_input_noise_decay_epochs: 30
d_skip_threshold: 0.4       # пропуск D-шага если он слишком уверен

# ── Loss variants ────────────────────────────────────
use_ragan: true
real_label: 0.9
fake_label: 0.0

# ── Stability ────────────────────────────────────────
grad_clip_val: 1.0
ema_decay: 0.999            # EMA генератора для стабильной валидации

# ── Pretrain ─────────────────────────────────────────
resume_generator_from: /mnt/home/ReservoirSR/artifacts/checkpoints/best/srresnet_generator.ckpt

# ── Optimizers (TTUR: D быстрее G) ───────────────────
g_optimizer:
  _target_: torch.optim.Adam
  lr: 5.0e-5
  betas: [0.9, 0.99]

d_optimizer:
  _target_: torch.optim.Adam
  lr: 2.0e-4
  betas: [0.9, 0.99]

g_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.max_epochs}
  eta_min: 1.0e-6

d_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.max_epochs}
  eta_min: 1.0e-6