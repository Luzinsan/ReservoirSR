# ==========================================================================
# Полный condition-вектор: все три группы скаляров.
# Модель получает максимум информации о текущем состоянии симуляции.
#
# Схема значений:
#   true       — группа включена, все параметры
#   [a, b, c]  — группа включена, только указанные параметры
#   false      — группа отключена
#
# Итоговая размерность: 14 (dynamic) + 57 (static) + 60 (layers) = 131.
# ==========================================================================

# Динамические скаляры (меняются на каждом timestep):
# time, AI, AIT, AIB, P_zab, Q_fld, Q_oil_*, DISS, DISQ, TBT, TB, TT.
dynamic: true

# Статические скаляры (постоянны в рамках одной симуляции):
# свойства флюида, пласта, скважины, сетки, солвера.
static: true

# Параметры слоёв (5 слоёв × 12 features = 60 значений):
# геометрия, пористость, насыщенность, проницаемость, флаги.
layers: true
