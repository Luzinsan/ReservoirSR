# ==========================================================================
# Стандартная конфигурация data pipeline.
# Параметры сгруппированы по назначению: source, split, loader.
#
# Вложенные config groups (condition, norm) подставляются из defaults.
# Переопределение: reservoir-sr-train data/condition=none
# ==========================================================================

defaults:
  # Какие скалярные группы включить в condition-вектор.
  - condition: full

  # Стратегии нормализации для полей и скаляров.
  - norm: default

# ── Источник данных ──────────────────────────────────────────────
source:
  # Путь к директории с .npz-архивами симуляций.
  # Каждый архив — один прогон (T timesteps × 3 channels × Z × X).
  dataset_dir: /mnt/home/dataset

  # Путь к файлу со статистикой нормализации (генерируется автоматически).
  stats_path: ${globals.artifacts_dir}/stats/stats.json

  # Размер LRU-кэша загруженных архивов в SrFrameDataset.
  # Чем больше — тем меньше повторных чтений с диска.
  # Ограничен RAM: один архив ≈ десятки MB.
  cache_size: 64

# ── Разбиение на train / val / test ─────────────────────────────
split:
  # Доля архивов на валидацию (0.0–1.0).
  # Сплит по архивам, не по timestep'ам → нет data leakage.
  val_fraction: 0.15

  # Доля архивов на тест (0.0–1.0).
  # Train = 1 − val_fraction − test_fraction.
  test_fraction: 0.15

  # Seed для детерминированного перемешивания архивов перед сплитом.
  seed: ${globals.seed}

# ── Параметры DataLoader ─────────────────────────────────────────
loader:
  # Размер батча (количество фреймов из разных архивов).
  batch_size: 16

  # Воркер-процессы для параллельной загрузки.
  num_workers: 4

  # Закрепить память для ускорения CPU→GPU трансфера.
  # true рекомендуется при обучении на GPU.
  pin_memory: true

  # Держать воркеры живыми между эпохами.
  # true ускоряет переход, но потребляет больше RAM.
  persistent_workers: true
