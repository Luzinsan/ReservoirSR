# ==========================================================================
# Стандартные стратегии нормализации.
# Каждый параметр привязан к семантической группе (см. norm_config.py),
# а группе назначена одна из стратегий: minmax, zscore, log_minmax,
# log_zscore, none.
#
# Стратегии:
#   minmax      — (x - min) / (max - min), приводит к [0, 1]
#   zscore      — (x - mean) / std, приводит к ~N(0, 1)
#   log_minmax  — minmax в log-пространстве (для величин с большим разбросом)
#   log_zscore  — zscore в log-пространстве
#   none        — без нормализации (для флагов, сеточных параметров и т.д.)
# ==========================================================================

# --------------------------------------------------------------------------
# Поля (channels): P (давление), ST (нефтенасыщенность сверху),
# SB (нефтенасыщенность снизу). Нормализуются поканально.
# --------------------------------------------------------------------------
fields:
  # Давление — нормальное распределение с большим разбросом → zscore.
  P: zscore
  # Насыщенности — ограничены физически [0, 1] → minmax.
  ST: minmax
  SB: minmax

# --------------------------------------------------------------------------
# Параметры слоёв пласта (5 слоёв × 12 features).
# Нормализуются per-feature, затем тайлятся на 5 слоёв.
# --------------------------------------------------------------------------
layers:
  # NZM (число ячеек по Z), HBM (толщина слоя) — geom. параметры.
  geometry: minmax
  # VMB, VMT — пористость блоков и трещин.
  porosity: minmax
  # SNT, SNB, SVT, SVB — граничные насыщенности.
  saturation: minmax
  # AKT, AKB — проницаемость. Варьируется на порядки → log-шкала.
  permeability: log_minmax
  # LWN, LWD — целочисленные флаги (0/1), нормализация не нужна.
  flags: none

# --------------------------------------------------------------------------
# Динамические скаляры (меняются на каждом timestep).
# --------------------------------------------------------------------------
dynamic:
  # Модельное время — монотонно растёт, нормализация не нужна
  # (или можно включить minmax при необходимости).
  time: none
  # AI, AIT, AIB — накопленные обводнённости [0, 1].
  accumulation: minmax
  # P_zab, Q_fld, Q_oil_* — давление и дебиты скважины.
  well_dynamic: minmax
  # DISS, DISQ — диссипативные члены, могут быть ≈0 с выбросами.
  dissipation: zscore
  # TBT, TB, TT — температуры в блоках и трещинах.
  temperature: minmax

# --------------------------------------------------------------------------
# Статические скаляры (постоянны в рамках одной симуляции).
# --------------------------------------------------------------------------
static:
  # Плотности, вязкости, теплоёмкости, термо/баро-коэффициенты, газ.
  fluid_props: minmax
  # Геометрия пласта, радиус скважины, сжимаемость.
  reservoir: minmax
  # Давления и расходы на контуре, режим скважины.
  well_ops: minmax
  # Временные шаги, длительности периодов — информационные.
  time_config: none
  # NB (число слоёв), NX (число ячеек по X), N_Dr — целочисленные.
  grid: none
  # LOD, LIZ, LTVK, LTK — булевы/целочисленные флаги.
  flags: none
  # EPSP, ENB, EVB, ENT, EVT — допуски солвера, не физические величины.
  solver: none
