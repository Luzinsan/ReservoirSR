# @package _global_
#
# Experiment: lightweight MSRResNet baseline.

defaults:
  - override /model: srresnet
  - override /trainer: default
  - override /data/condition: none

globals:
  experiment_name: srresnet_baseline

model:
  optimizer:
    lr: 4e-4
    weight_decay: 1e-4
  scheduler:
    eta_min: 1e-6

trainer:
  max_epochs: 150
  gradient_clip_val: 5.0
  check_val_every_n_epoch: 5
