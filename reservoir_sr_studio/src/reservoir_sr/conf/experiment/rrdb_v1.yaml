# @package _global_
defaults:
  - override /model: rrdb
  - override /trainer: default
  - override /data/condition: none

globals:
  experiment_name: rrdb_v1
  resume_from: artifacts/checkpoints/rrdb_v1/epoch=119.ckpt

task: sr

model:
  n_blocks: 23
  unshuffle_factor: 2
  res_scale: 0.2
  ema_decay: 0.999
  optimizer:
    lr: 2.0e-4
    weight_decay: 0.0
  scheduler:
    warmup_epochs: 5

data:
  loader:
    batch_size: 16

trainer:
  max_epochs: 200
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 5