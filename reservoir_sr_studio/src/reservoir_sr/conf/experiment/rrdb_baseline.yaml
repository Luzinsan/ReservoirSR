# @package _global_
#
# Experiment: RRDB PSNR baseline.
# Безусловная SR-модель на основе ESRGAN-генератора (RRDBNet).
# Фаза 1 (PSNR pretrain): обучение с L1 loss.
#
# Использование:
#   python -m reservoir_sr.tools.train +experiment=rrdb_baseline

defaults:
  - override /model: rrdb
  - override /trainer: default
  - override /data/condition: none

globals:
  experiment_name: rrdb_baseline

model:
  optimizer:
    lr: 0.0002
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 100

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
